[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autosearch"
version = "0.1.0"
description = "Static memory-corruption code-audit pipeline driven by LLM agents"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Proprietary"}
authors = [{name = "utkarshpal"}]
dependencies = [
    "click>=8.1",
    "tomli>=2.0; python_version<'3.11'",
    "rich>=13.0",
    "textual>=0.60",
    "github-copilot-sdk>=0.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.1"]

[project.scripts]
autosearch = "autosearch.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
autosearch = ["agents/*.md", "store/*.sql"]
